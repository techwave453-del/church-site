<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administrator Setup</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(560px,100%);background:#fff;border-radius:20px;padding:30px;box-shadow:0 18px 60px rgba(0,0,0,.12)}h1{margin:0 0 8px;font-size:1.7rem}.lead{margin:0 0 24px;color:#667085;line-height:1.5}.step{display:flex;gap:12px;align-items:flex-start;margin:0 0 20px}.num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#243b7a;color:#fff;font-weight:800;flex:none}.step strong{display:block;margin-bottom:3px}.muted{color:#667085}.small{font-size:.9rem}label{display:block;font-weight:700;margin:16px 0 7px}input,button{width:100%;padding:13px;border-radius:11px;font:inherit}input{border:1px solid #cbd2dc}button{border:0;background:#243b7a;color:#fff;font-weight:750;cursor:pointer;margin-top:16px}button:disabled{opacity:.55;cursor:not-allowed}.hidden{display:none}.status{padding:15px;border-radius:12px;background:#eef3ff;margin-top:18px}.error{color:#a11;margin-top:12px}.success{color:#176b3a}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.choice{border:2px solid #ccd3df;padding:16px;text-align:center;border-radius:12px;cursor:pointer;font-size:1.2rem}.choice input{width:auto}.choice:has(input:checked){border-color:#243b7a;background:#eef3ff}.code{display:flex;gap:7px;justify-content:center;align-items:center;margin:12px 0 22px}.code input{width:42px;height:52px;text-align:center;font-size:20px;font-weight:800;padding:4px}.code .sep{font-weight:800}.timer{font-weight:800}@media(max-width:390px){.card{padding:22px}.choices{gap:6px}.choice{padding:12px 5px}.code{gap:4px}.code input{width:35px;height:48px;font-size:17px}}
</style>
</head>
<body>
<main class="card">
<h1>Administrator Account Setup</h1>
<p class="lead">Set up your administrator account.</p>

<section id="start">
<div class="step"><span class="num">1</span><div><strong>Get started</strong></div></div>
<label for="username">Username</label>
<input id="username" autocomplete="username" maxlength="40" placeholder="Choose a username">
<button id="requestBtn" type="button">Continue</button>
<div id="startError" class="error" role="alert"></div>
</section>

<section id="verify" class="hidden">
<div class="step"><span class="num">2</span><div><strong>Verification</strong></div></div>
<div id="choices" class="choices"></div>
<button id="selectBtn" type="button">Continue</button>
<div class="status"><strong>Please wait…</strong> <span id="timer" class="timer"></span></div>
<div id="verifyError" class="error" role="alert"></div>
</section>

<section id="password" class="hidden">
<div class="step"><span class="num">3</span><div><strong>Create your password</strong></div></div>
<div id="code" class="code" aria-label="Verification code"></div>
<label for="passwordInput">Password</label>
<input id="passwordInput" type="password" autocomplete="new-password">
<label for="confirmInput">Confirm password</label>
<input id="confirmInput" type="password" autocomplete="new-password">
<button id="finishBtn" type="button">Complete Setup</button>
<div id="passwordError" class="error" role="alert"></div>
</section>

<section id="expired" class="hidden">
<h2>Setup unavailable</h2>
<p class="muted">Please start again.</p>
<button id="restartBtn" type="button">Start Again</button>
</section>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id);let expiresAt=0,timer=null,pollTimer=null;
async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',cache:'no-store',...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Something went wrong.');return d}
function show(id){['start','verify','password','expired'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function countdown(){clearInterval(timer);timer=setInterval(()=>{const left=Math.max(0,expiresAt-Date.now());$('timer').textContent=`(${Math.ceil(left/1000)}s)`;if(!left){clearInterval(timer);clearTimeout(pollTimer);show('expired')}},250)}
function renderCode(code){const box=$('code');box.innerHTML='';const parts=String(code||'').replace(/^KFC-/i,'').split('-');parts.forEach((part,pi)=>{[...part].forEach(ch=>{const i=document.createElement('input');i.value=ch;i.readOnly=true;i.tabIndex=-1;box.appendChild(i)});if(pi<parts.length-1){const s=document.createElement('span');s.className='sep';s.textContent='-';box.appendChild(s)}})}
async function requestCode(){const btn=$('requestBtn');$('startError').textContent='';btn.disabled=true;try{const d=await api('/api/admin/access/request',{method:'POST',body:JSON.stringify({username:$('username').value.trim()})});$('choices').innerHTML=(d.choices||[]).map(c=>`<label class="choice"><input type="radio" name="choice" value="${c}"> <strong>${c}</strong></label>`).join('');expiresAt=new Date(d.expiresAt).getTime();show('verify');countdown();poll()}catch(e){$('startError').textContent=e.message}finally{btn.disabled=false}}
async function select(){const selected=document.querySelector('input[name="choice"]:checked')?.value;if(!selected){$('verifyError').textContent='Please choose a number.';return}const btn=$('selectBtn');btn.disabled=true;$('verifyError').textContent='';try{await api('/api/admin/access/select',{method:'POST',body:JSON.stringify({choice:selected})});poll()}catch(e){$('verifyError').textContent=e.message;btn.disabled=false}}
async function poll(){clearTimeout(pollTimer);try{const d=await api('/api/admin/access/status');if(d.status==='approved'&&d.activationCode){clearInterval(timer);renderCode(d.activationCode);show('password');return}if(['expired','rejected'].includes(d.status)){clearInterval(timer);show('expired');return}pollTimer=setTimeout(poll,2500)}catch(e){pollTimer=setTimeout(poll,4000)}}
async function finish(){const password=$('passwordInput').value,confirm=$('confirmInput').value;if(password.length<8){$('passwordError').textContent='Password must be at least 8 characters.';return}if(password!==confirm){$('passwordError').textContent='Passwords do not match.';return}const btn=$('finishBtn');btn.disabled=true;try{await api('/api/admin/activate',{method:'POST',body:JSON.stringify({username:$('username').value.trim(),code:[...$('code').querySelectorAll('input')].map(x=>x.value).join(''),password})});$('passwordError').className='success';$('passwordError').textContent='Setup complete. You can now sign in.'}catch(e){$('passwordError').className='error';$('passwordError').textContent=e.message;btn.disabled=false}}
$('requestBtn').onclick=requestCode;$('selectBtn').onclick=select;$('finishBtn').onclick=finish;$('restartBtn').onclick=()=>location.reload();
})();
</script>
</body>
</html>
