name: Repair npm lockfile on PR
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify npm ci
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit repaired lockfile and remove repair workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/repair-npm-lock-pr.yml .github/workflows/repair-npm-lock.yml || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix npm lockfile sync for Supabase dependency"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
