name: Admin refactor checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [refactor/modular-architecture-phase-1]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/refactor-check.mjs
      - run: npm run build
