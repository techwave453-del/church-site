<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Church Content Manager</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#07131d;color:#edf5ff}main{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}h1,h2{margin:0 0 8px}p{color:#9fb6c8}.card{background:#10202d;border:1px solid #ffffff12;border-radius:16px;padding:20px;margin-bottom:18px}label{display:block;color:#9fb6c8;font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:14px 0}input,textarea,select{width:100%;box-sizing:border-box;background:#07131d;color:#fff;border:1px solid #ffffff18;border-radius:10px;padding:12px;margin-top:7px;font:inherit}textarea{min-height:100px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.section{border-top:1px solid #ffffff10;margin-top:18px;padding-top:18px}.btn{border:0;border-radius:999px;padding:11px 17px;background:#4da6ff;color:#fff;font-weight:700;cursor:pointer}.muted{background:#ffffff0d}.notice{padding:12px;border-radius:10px;background:#4da6ff18;margin:12px 0}.theme-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.theme-option{position:relative;border:2px solid #ffffff18;border-radius:14px;padding:14px;background:#07131d;color:#fff;cursor:pointer;text-align:left}.theme-option.active{border-color:#4da6ff;box-shadow:0 0 0 3px #4da6ff22}.swatch{height:34px;border-radius:9px;margin-bottom:10px}.theme-note{font-size:12px;color:#9fb6c8}@media(max-width:700px){main{padding:18px}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main><div class="top"><div><h1>Church Content Manager</h1><p>Edit services, events, detailed information and the public website theme.</p></div><button class="btn muted" onclick="location.href='/admin'">← Admin</button></div><div id="app"><p>Loading…</p></div></main><script>
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');const slug=s=>String(s||'').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');let content={};
async function init(){let session=await fetch('/api/admin/session',{credentials:'include'});if(!session.ok){document.getElementById('app').innerHTML='<div class="card"><h2>Admin login required</h2><p>Please sign in through the main admin page first.</p><button class="btn" onclick="location.href=\'/admin\'">Go to Admin Login</button></div>';return}let r=await fetch('/api/site/content',{credentials:'include'});content=await r.json();render()}
function render(){let services=content.services||[],links=content.links||[],classes=content.membershipClasses||[],dc=content.detailContent||{},theme={mode:content.theme?.mode==='dark'?'dark':'light',accent:content.theme?.accent||'#4da6ff'};document.getElementById('app').innerHTML=`<div class="card"><h2>Website Theme</h2><p>Choose the accent color used across the public website. The page background stays white in Light mode. Dark mode changes surfaces and text together for strong contrast.</p><div class="theme-grid"><button class="theme-option ${theme.accent==='#4da6ff'?'active':''}" data-accent="#4da6ff" onclick="setAccent('#4da6ff')"><div class="swatch" style="background:#4da6ff"></div><strong>Ocean Blue</strong></button><button class="theme-option ${theme.accent==='#7c3aed'?'active':''}" data-accent="#7c3aed" onclick="setAccent('#7c3aed')"><div class="swatch" style="background:#7c3aed"></div><strong>Royal Purple</strong></button><button class="theme-option ${theme.accent==='#e11d48'?'active':''}" data-accent="#e11d48" onclick="setAccent('#e11d48')"><div class="swatch" style="background:#e11d48"></div><strong>Ruby</strong></button><button class="theme-option ${theme.accent==='#059669'?'active':''}" data-accent="#059669" onclick="setAccent('#059669')"><div class="swatch" style="background:#059669"></div><strong>Emerald</strong></button><button class="theme-option ${theme.accent==='#d97706'?'active':''}" data-accent="#d97706" onclick="setAccent('#d97706')"><div class="swatch" style="background:#d97706"></div><strong>Amber</strong></button></div><div class="grid"><label>Website appearance<select id="themeMode"><option value="light" ${theme.mode==='light'?'selected':''}>Light — white background</option><option value="dark" ${theme.mode==='dark'?'selected':''}>Dark — high-contrast dark surfaces</option></select></label><label>Custom accent color<input id="themeAccent" type="color" value="${esc(theme.accent)}"></label></div><p class="theme-note">Accent selection affects buttons, links, highlights and interactive elements. It does not change the white background in Light mode.</p></div><div class="card"><h2>Services & Events</h2><p>Edit the visible service name/time and its detailed page.</p>${services.map((x,i)=>serviceForm(x,i,dc[slug(x.title)]||{})).join('')}</div><div class="card"><h2>Other Website Pages</h2>${links.map((x,i)=>detailForm(x,i,dc[slug(x.title)]||{},'link')).join('')}</div><div class="card"><h2>Classes</h2>${classes.map((x,i)=>detailForm(x,i,dc[slug(x.title)]||{},'class')).join('')}</div><div class="card"><h2>Contact & Visit</h2><div class="grid"><label>Phone<input id="phone" value="${esc(content.phone)}"></label><label>Email<input id="email" value="${esc(content.email)}"></label></div></div><div class="card"><button class="btn" onclick="save()">Save All Changes</button><div id="notice"></div></div>`}
function setAccent(v){document.getElementById('themeAccent').value=v;document.querySelectorAll('.theme-option').forEach(x=>x.classList.toggle('active',x.dataset.accent===v))}
function serviceForm(x,i,d){return `<div class="section"><h3>${esc(x.title)}</h3><div class="grid"><label>Service name<input data-s="${i}" data-k="title" value="${esc(x.title)}"></label><label>Schedule<input data-s="${i}" data-k="time" value="${esc(x.time)}"></label></div>${detailFields('s'+i,d)}</div>`}
function detailForm(x,i,d,type){return `<div class="section"><h3>${esc(x.title)}</h3><label>Title<input data-${type}="${i}" data-k="title" value="${esc(x.title)}"></label>${detailFields(type[0]+i,d)}</div>`}
function detailFields(id,d){let ss=Array.isArray(d.sections)?d.sections:[['What to Expect','',''],['Who Can Attend?','', ''],['More Information','','']];return `<label>Short introduction<textarea id="intro-${id}">${esc(d.summary||'')}</textarea></label><label>Eyebrow<input id="eyebrow-${id}" value="${esc(d.eyebrow||'Church Information')}"></label><label>Schedule<input id="schedule-${id}" value="${esc(d.schedule||'')}"></label><div class="grid">${[0,1,2].map(n=>`<div><label>Section ${n+1} heading<input id="h-${id}-${n}" value="${esc(ss[n]?.[0]||'')}"></label><label>Section ${n+1} text<textarea id="t-${id}-${n}">${esc(ss[n]?.[1]||'')}</textarea></label></div>`).join('')}</div>`}
function readDetail(id){return{eyebrow:document.getElementById('eyebrow-'+id).value,summary:document.getElementById('intro-'+id).value,schedule:document.getElementById('schedule-'+id).value,sections:[0,1,2].map(n=>[document.getElementById('h-'+id+'-'+n).value,document.getElementById('t-'+id+'-'+n).value]).filter(x=>x[0]||x[1])}}
async function save(){let services=[...(content.services||[])],links=[...(content.links||[])],classes=[...(content.membershipClasses||[])],dc={...(content.detailContent||{})};document.querySelectorAll('[data-s][data-k]').forEach(e=>services[+e.dataset.s][e.dataset.k]=e.value);services.forEach((x,i)=>dc[slug(x.title)]=readDetail('s'+i));document.querySelectorAll('[data-link][data-k]').forEach(e=>links[+e.dataset.link][e.dataset.k]=e.value);links.forEach((x,i)=>dc[slug(x.title)]=readDetail('l'+i));document.querySelectorAll('[data-class][data-k]').forEach(e=>classes[+e.dataset.class][e.dataset.k]=e.value);classes.forEach((x,i)=>dc[slug(x.title)]=readDetail('c'+i));content={...content,services,links,membershipClasses:classes,detailContent:dc,phone:document.getElementById('phone').value,email:document.getElementById('email').value,theme:{mode:document.getElementById('themeMode').value,accent:document.getElementById('themeAccent').value}};let r=await fetch('/api/site/content',{method:'PUT',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(content)});document.getElementById('notice').innerHTML=r.ok?'<div class="notice">✓ Changes saved. Refresh the public website to apply the new theme.</div>':'<div class="notice">Unable to save changes. Please sign in again.</div>'}
init();</script></body></html>
