<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Events Manager | Admin</title><style>:root{--bg:#07131d;--panel:#10202d;--line:#ffffff14;--text:#edf5ff;--muted:#9fb6c8;--accent:#4da6ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1180px;margin:auto;padding:26px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:22px}.top p{margin:5px 0;color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}.btn{border:0;border-radius:999px;padding:11px 17px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#ffffff0d}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}label{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}input,textarea,select{width:100%;margin-top:7px;background:#07131d;color:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}textarea{min-height:110px;resize:vertical}.full{grid-column:1/-1}.event{border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:12px;margin-top:10px}.event h3{margin:0 0 6px}.event p{margin:5px 0;color:var(--muted)}.actions{display:flex;gap:7px;align-items:center}.tag{display:inline-block;border-radius:999px;padding:4px 8px;background:#4da6ff18;color:#9fd0ff;font-size:11px;font-weight:700}.notice{margin-top:12px;padding:12px;border-radius:10px;background:#4da6ff18;color:#d8edff}.danger{background:#e34b5a22;color:#ffb8c0}@media(max-width:700px){main{padding:16px}.top{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.full{grid-column:auto}.event{grid-template-columns:1fr}.actions{justify-content:flex-start;flex-wrap:wrap}}</style></head><body><main><div class="top"><div><h1>Events Manager</h1><p>Create and publish special church programmes independently from recurring service times.</p></div><button class="btn secondary" onclick="location.href='/admin'">← Admin</button></div><section class="card"><div class="toolbar"><div><h2 id="formTitle">Create Event</h2><p>Events saved here power the public <a href="/events.html" target="_blank" style="color:#9fd0ff">Events page</a>.</p></div><button class="btn secondary" onclick="resetForm()">Clear</button></div><form id="form"><div class="grid"><label>Event title<input id="title" required placeholder="e.g. Annual Thanksgiving Service"></label><label>Category<input id="category" value="General" placeholder="Conference, Youth, Worship…"></label><label>Start date & time<input id="start_at" type="datetime-local" required></label><label>End date & time<input id="end_at" type="datetime-local"></label><label>Location<input id="location" placeholder="Main Sanctuary"></label><label>Address<input id="address" placeholder="Church address"></label><label>Attendance<select id="attendance_type"><option value="in_person">In person</option><option value="online">Online</option><option value="hybrid">In person + Online</option></select></label><label>Status<select id="status"><option value="draft">Draft</option><option value="published">Published</option><option value="archived">Archived</option></select></label><label>Image URL<input id="image" placeholder="Paste media image URL"></label><label>Flyer URL<input id="flyer_url" placeholder="Optional flyer/PDF URL"></label><label>Registration URL<input id="registration_url" placeholder="Optional registration link"></label><label>Livestream URL<input id="livestream_url" placeholder="Optional live stream link"></label><label>Contact<input id="contact" placeholder="Phone or email"></label><label>Display order<input id="display_order" type="number" value="0"></label><label class="full">Short description<textarea id="short_description" placeholder="One or two sentences shown on cards"></textarea></label><label class="full">Full description<textarea id="description" placeholder="Full event information"></textarea></label><label><input id="all_day" type="checkbox" style="width:auto;margin-right:7px"> All-day event</label><label><input id="featured" type="checkbox" style="width:auto;margin-right:7px"> Feature this event</label></div><div style="margin-top:18px"><button class="btn" type="submit">Save Event</button></div></form><div id="notice"></div></section><section class="card"><div class="toolbar"><div><h2>Published & Draft Events</h2><p>Manage every event from one place.</p></div><button class="btn secondary" onclick="loadEvents()">Refresh</button></div><div id="list">Loading…</div></section></main><script>let events=[],editingId=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const localDate=v=>{if(!v)return'';const d=new Date(v);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`};async function loadEvents(){const r=await fetch('/api/events',{credentials:'include',cache:'no-store'});if(!r.ok){$('list').innerHTML='<div class="notice danger">Unable to load events. Please sign in through the main Admin Panel.</div>';return}events=await r.json();$('list').innerHTML=events.length?events.map(e=>`<article class="event"><div><span class="tag">${esc(e.status)} · ${esc(e.category)}</span><h3>${esc(e.title)}</h3><p>${new Date(e.start_at).toLocaleString()}${e.location?' · '+esc(e.location):''}</p><p>${esc(e.short_description||'No short description')}</p></div><div class="actions"><button class="btn secondary" onclick="editEvent('${e.id}')">Edit</button><button class="btn secondary" onclick="deleteEvent('${e.id}')">Delete</button></div></article>`).join(''):'<p style="color:var(--muted)">No events yet. Create the first one above.</p>'}function editEvent(id){const e=events.find(x=>String(x.id)===String(id));if(!e)return;editingId=id;$('formTitle').textContent='Edit Event';['title','category','location','address','image','flyer_url','registration_url','livestream_url','contact','short_description','description','display_order'].forEach(k=>$(k).value=e[k]??'');$('start_at').value=localDate(e.start_at);$('end_at').value=localDate(e.end_at);$('attendance_type').value=e.attendance_type||'in_person';$('status').value=e.status||'draft';$('all_day').checked=Boolean(e.all_day);$('featured').checked=Boolean(e.featured);scrollTo({top:0,behavior:'smooth'})}function resetForm(){editingId=null;$('formTitle').textContent='Create Event';$('form').reset();$('category').value='General';$('status').value='draft';$('attendance_type').value='in_person';$('display_order').value='0';$('notice').innerHTML=''}$('form').addEventListener('submit',async ev=>{ev.preventDefault();const payload={title:$('title').value,category:$('category').value,start_at:$('start_at').value,end_at:$('end_at').value||null,location:$('location').value,address:$('address').value,attendance_type:$('attendance_type').value,status:$('status').value,image:$('image').value,flyer_url:$('flyer_url').value,registration_url:$('registration_url').value,livestream_url:$('livestream_url').value,contact:$('contact').value,short_description:$('short_description').value,description:$('description').value,display_order:Number($('display_order').value||0),all_day:$('all_day').checked,featured:$('featured').checked};const r=await fetch(editingId?`/api/admin/events/${editingId}`:'/api/admin/events',{method:editingId?'PUT':'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json().catch(()=>({}));$('notice').innerHTML=r.ok?'<div class="notice">✓ Event saved successfully.</div>':`<div class="notice danger">${esc(data.error||'Unable to save event.')}</div>`;if(r.ok){resetForm();await loadEvents()}});async function deleteEvent(id){if(!confirm('Delete this event?'))return;const r=await fetch(`/api/admin/events/${id}`,{method:'DELETE',credentials:'include',headers:{'Content-Type':'application/json'}});if(r.ok)loadEvents();else $('notice').innerHTML='<div class="notice danger">Unable to delete event.</div>'}loadEvents();</script></body></html>
