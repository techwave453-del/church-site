<!doctype html>
<html lang="en">
<head>

  <meta name="theme-color" content="#173b67">
  <title>You're Offline | Kingdom Fellowship Christian Church</title>

<body>
  <main>
    <img src="/pwa-icon-192.svg" alt="Church icon">
